[build]
  publish = "."
  functions = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  # Pinned so global fetch/FormData/Blob (used by transcribe-audio.js to
  # upload to OpenAI) are guaranteed available without extra dependencies.
  NODE_VERSION = "22"

# Netlify installs netlify/functions/package.json dependencies automatically
# during deploy — nothing extra needed here for that.

# Scheduled (cron) functions — Netlify calls these on its own, no client
# request triggers them.
[functions."send-daily-reminder"]
  schedule = "@hourly"

[functions."send-reengagement-email"]
  schedule = "@daily"
